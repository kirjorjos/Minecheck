name: Cross-version backport

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Source pull request number"
        required: true
        type: string
      versions:
        description: "Comma-separated target Minecraft versions, e.g. 1.20.1,1.21.1"
        required: true
        type: string
      dry_run:
        description: "Check and report only; push and open nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: backport-pr-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  backport:
    name: Backport
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - name: Apply to every target
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          VERSIONS_RAW: ${{ inputs.versions }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          REPO = os.environ["REPO"]
          PR = os.environ["PR"]
          RAW = os.environ["VERSIONS_RAW"]
          DRY = os.environ["DRY_RUN"] == "true"
          PUSH_TOKEN = os.environ["PUSH_TOKEN"]

          VERSION_RE = re.compile(r"^[0-9]+(?:\.[0-9]+){1,2}$")
          DEVELOPMENT_RE = re.compile(r"^([0-9]+(?:\.[0-9]+){1,2})/development$")
          ALLOWED_CHECK_STATES = {"SUCCESS", "SKIPPED", "NEUTRAL"}


          def run(cmd, check=True, env=None):
              return subprocess.run(
                  cmd, text=True, capture_output=True, check=check, env=env
              )


          def push_env():
              # Keep the token out of command lines and URLs, so a failed push cannot log it.
              import base64

              header = base64.b64encode(f"x-access-token:{PUSH_TOKEN}".encode()).decode()
              environment = dict(os.environ)
              environment.update(
                  {
                      "GIT_CONFIG_COUNT": "1",
                      "GIT_CONFIG_KEY_0": "http.https://github.com/.extraheader",
                      "GIT_CONFIG_VALUE_0": f"AUTHORIZATION: basic {header}",
                  }
              )
              return environment


          def gh(*args, token=None, check=True):
              environment = dict(os.environ)
              environment["GH_TOKEN"] = token or os.environ["GH_TOKEN"]
              return run(["gh", *args], check=check, env=environment)


          def gh_json(*args, token=None):
              return json.loads(gh(*args, token=token).stdout)


          def fail(messages):
              if isinstance(messages, str):
                  messages = [messages]
              for message in messages:
                  print(f"::error::{message}")
              print("\n".join(messages))
              sys.exit(1)


          def parse_versions(raw):
              items = [x.strip() for x in raw.split(",") if x.strip()]
              if not items:
                  fail("the versions input is empty")
              unique = []
              for item in items:
                  if not VERSION_RE.fullmatch(item):
                      fail(f"invalid Minecraft version {item!r}")
                  if item in unique:
                      fail(f"duplicate Minecraft version {item!r}")
                  unique.append(item)
              return unique


          def branch_exists(branch):
              return run(
                  ["git", "ls-remote", "--exit-code", "--heads", "origin", f"refs/heads/{branch}"],
                  check=False,
              ).returncode == 0


          def remote_branch_exists(branch):
              return bool(
                  run(
                      ["git", "ls-remote", "--exit-code", "--heads", "origin", f"refs/heads/{branch}"],
                      check=False,
                  ).stdout.strip()
              )


          def source_pr():
              result = gh(
                  "pr",
                  "view",
                  PR,
                  "--repo",
                  REPO,
                  "--json",
                  "number,state,baseRefName,headRefName,headRefOid,baseRefOid,mergeCommit,title,url,author",
                  check=False,
              )
              if result.returncode != 0:
                  fail(f"could not read PR #{PR}: {result.stderr.strip()}")
              return json.loads(result.stdout)


          def require_green_checks():
              result = gh("pr", "checks", PR, "--repo", REPO, "--json", "name,state", check=False)
              if result.returncode != 0 and not result.stdout.strip():
                  fail(f"could not read checks for PR #{PR}: {result.stderr.strip()}")
              checks = json.loads(result.stdout or "[]")
              bad = [check for check in checks if check.get("state") not in ALLOWED_CHECK_STATES]
              if bad:
                  detail = ", ".join(f'{check["name"]}={check["state"]}' for check in bad)
                  fail(f"PR #{PR} is open but not green: {detail}")
              if not any(check.get("state") == "SUCCESS" for check in checks):
                  fail(f"PR #{PR} is open but has no successful check yet")
              return checks


          def patch_for(pr):
              if pr["state"] == "MERGED":
                  merge_commit = (pr.get("mergeCommit") or {}).get("oid")
                  if not merge_commit:
                      fail(f"PR #{PR} is merged but exposes no merge commit")
                  run(["git", "fetch", "--no-tags", "origin", merge_commit])
                  result = run(
                      ["git", "diff", f"{merge_commit}^1", merge_commit, "--binary"],
                      check=False,
                  )
                  if result.returncode != 0:
                      fail(f"could not compute the net diff of {merge_commit}")
                  return result.stdout, merge_commit

              if pr["state"] == "OPEN":
                  run(["git", "fetch", "--no-tags", "origin", pr["baseRefOid"]])
                  run(["git", "fetch", "--no-tags", "origin", pr["headRefOid"]])
                  result = run(
                      ["git", "diff", f'{pr["baseRefOid"]}...{pr["headRefOid"]}', "--binary"],
                      check=False,
                  )
                  if result.returncode != 0:
                      fail(f"could not compute the diff of PR #{PR}")
                  return result.stdout, pr["headRefOid"]

              fail(f"PR #{PR} is {pr['state'].lower()}; only merged PRs or open green PRs can be backported")


          def backport_branch(source_head, target_version):
              if "/" in source_head:
                  prefix, rest = source_head.split("/", 1)
                  if VERSION_RE.fullmatch(prefix):
                      return f"{target_version}/{rest}"
                  return f"{target_version}/{source_head}"
              return f"{target_version}/{source_head}"


          def author_identity(login):
              result = gh("api", f"users/{login}", check=False)
              data = json.loads(result.stdout) if result.returncode == 0 and result.stdout.strip() else {}
              user_id = data.get("id")
              name = data.get("name") or login
              if user_id:
                  email = f"{user_id}+{login}@users.noreply.github.com"
              else:
                  email = f"{login}@users.noreply.github.com"
              return name, email


          def prepare_worktree(path, branch):
              run(["git", "worktree", "remove", "--force", path], check=False)
              run(["git", "fetch", "--no-tags", "origin", branch])
              run(["git", "worktree", "add", "--detach", path, f"origin/{branch}"])


          def main():
              versions = parse_versions(RAW)
              pr = source_pr()
              base = pr.get("baseRefName") or ""
              base_match = DEVELOPMENT_RE.match(base)
              if not base_match:
                  fail(
                      f"PR #{PR} targets {base!r}; only PRs into <version>/development can be backported"
                  )
              source_version = base_match.group(1)
              if pr.get("state") == "OPEN":
                  require_green_checks()

              patch, source_sha = patch_for(pr)
              with open("/tmp/backport.patch", "w") as handle:
                  handle.write(patch)

              targets = []
              for version in versions:
                  if version == source_version:
                      targets.append(
                          {
                              "version": version,
                              "branch": f"{version}/development",
                              "status": "ignored (source)",
                          }
                      )
                      continue
                  targets.append(
                      {
                          "version": version,
                          "branch": f"{version}/development",
                          "backport": backport_branch(pr["headRefName"], version),
                          "status": "pending",
                      }
                  )

              failures = []
              empty_patch = not patch.strip()

              for target in targets:
                  if target["status"] != "pending":
                      continue
                  branch = target["branch"]
                  if not remote_branch_exists(branch):
                      failures.append(f"{branch}: target branch does not exist")
                      target["status"] = "invalid target"
                      continue

                  backport = target["backport"]
                  if branch_exists(backport):
                      failures.append(f"{backport}: branch already exists")
                      target["status"] = "branch exists"
                      continue

                  existing = gh_json(
                      "pr", "list", "--repo", REPO, "--head", backport, "--state", "open", "--json", "number"
                  )
                  if existing:
                      failures.append(f"{backport}: open PR #{existing[0]['number']} already exists")
                      target["status"] = "pr exists"
                      continue

                  worktree = f'/tmp/backport-{target["version"].replace(".", "_")}'
                  prepare_worktree(worktree, branch)
                  check = run(
                      ["git", "-C", worktree, "apply", "--check", "--3way", "/tmp/backport.patch"],
                      check=False,
                  )
                  run(["git", "worktree", "remove", "--force", worktree], check=False)
                  if check.returncode != 0:
                      failures.append(f"{branch}: patch does not apply cleanly")
                      target["status"] = "conflict"
                      target["detail"] = check.stderr.strip().splitlines()[-1:] or ["conflict"]
                      continue
                  target["status"] = "already present" if empty_patch else "ready"

              if failures:
                  print("| Version | Target | Status | Detail |")
                  print("|---|---|---|---|")
                  for target in targets:
                      detail = "; ".join(target.get("detail", []))
                      print(f'| {target["version"]} | {target["branch"]} | {target["status"]} | {detail} |')
                  fail(failures)

              if empty_patch:
                  print("The source diff is empty; every target already contains it.")
                  print("| Version | Target | Status |")
                  print("|---|---|---|")
                  for target in targets:
                      print(f'| {target["version"]} | {target["branch"]} | {target["status"]} |')
                  return 0

              name, email = author_identity((pr.get("author") or {}).get("login") or "github-actions[bot]")
              environment = dict(os.environ)
              environment.update(
                  {
                      "GIT_AUTHOR_NAME": name,
                      "GIT_AUTHOR_EMAIL": email,
                      "GIT_COMMITTER_NAME": "github-actions[bot]",
                      "GIT_COMMITTER_EMAIL": "41898282+github-actions[bot]@users.noreply.github.com",
                  }
              )

              body = (
                  f"Backport of #{PR} ({pr['url']}) to `{source_version}` → target.\n\n"
                  f"Source commit: `{source_sha}`\n\n"
                  "<!-- cross-version-backport -->\n"
              )
              with open("/tmp/backport-body.md", "w") as handle:
                  handle.write(body)

              for target in targets:
                  if target["status"] != "ready":
                      continue

                  backport = target["backport"]
                  worktree = f'/tmp/backport-{target["version"].replace(".", "_")}'
                  prepare_worktree(worktree, target["branch"])
                  run(["git", "-C", worktree, "apply", "--3way", "--index", "/tmp/backport.patch"])
                  run(
                      [
                          "git",
                          "-C",
                          worktree,
                          "commit",
                          "-m",
                          f'{pr["title"]} (#{PR})',
                          "-m",
                          body,
                      ],
                      env=environment,
                  )

                  if DRY:
                      target["status"] = "would open"
                      run(["git", "worktree", "remove", "--force", worktree], check=False)
                      continue

                  pushed = run(
                      ["git", "-C", worktree, "push", "origin", f"HEAD:refs/heads/{backport}"],
                      check=False,
                      env=push_env(),
                  )
                  if pushed.returncode != 0:
                      fail(f"could not push {backport}; details redacted from the log")
                  created = gh(
                      "pr",
                      "create",
                      "--repo",
                      REPO,
                      "--base",
                      target["branch"],
                      "--head",
                      backport,
                      "--title",
                      pr["title"],
                      "--body-file",
                      "/tmp/backport-body.md",
                      token=PUSH_TOKEN,
                  ).stdout.strip()
                  target["status"] = f"opened {created}"
                  run(["git", "worktree", "remove", "--force", worktree], check=False)

              print("| Version | Target | Backport branch | Status |")
              print("|---|---|---|---|")
              for target in targets:
                  print(
                      f'| {target["version"]} | {target["branch"]} | '
                      f'{target.get("backport", "")} | {target["status"]} |'
                  )

              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a") as handle:
                      handle.write("## Cross-version backport\n\n")
                      handle.write("| Version | Target | Backport branch | Status |\n|---|---|---|---|\n")
                      for target in targets:
                          handle.write(
                              f'| {target["version"]} | {target["branch"]} | '
                              f'{target.get("backport", "")} | {target["status"]} |\n'
                          )
              return 0


          sys.exit(main())
          PY
