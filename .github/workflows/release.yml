# generated by kirjorjos/ci - do not edit; this file is overwritten on the next sync.
#
# The release loop: bump, promote, tag, build, stage and publish one Minecraft line at a time. Every
# fact that differs between lines - the jar prefix, the variants a line ships, the staging directory
# and the loader list - comes from that line's `.github/metadata.json`, not from a second copy here.
name: Release

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated Minecraft versions to release, e.g. 1.19.2,1.20.1"
        required: true
        type: string
      bump:
        description: "Which component of the current version to increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: "Preflight and print the plan; push, tag and publish nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare promotion PRs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Write, not read: the job ensures the `release` label before it opens the promotion PR, and a
      # label cannot be created with `issues: read`. Only the first release of a repository needs
      # that - afterwards the label is already there - which is exactly the run that promotes a new
      # line, so a read-only token failed the first release and never the second.
      issues: write
      # Reading the post-merge chore's runs before a version's work starts.
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint an app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - name: Preflight, bump and promote
        id: plan
        env:
          # The promotion PR must be authored by github-actions[bot] (the rule for */main), so the
          # default token opens it. The app token is used only for the one write that has to bypass
          # the PR-only rule on */development: the version bump.
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          VERSIONS_RAW: ${{ inputs.versions }}
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time

          REPO = os.environ["REPO"]
          RAW = os.environ["VERSIONS_RAW"]
          BUMP = os.environ["BUMP"]
          DRY = os.environ["DRY_RUN"] == "true"

          # Every version write this job made that a promotion PR does not carry yet, as
          # (mc, previous version). A failure between the bump and the PR would otherwise leave an
          # incremented version on a PR-only branch with nothing released and no PR to finish it,
          # and the next dispatch would bump the already-bumped number again (three failed attempts
          # left RegistryExtractor at 0.0.4 with no tag).
          BUMPS = []


          def run(cmd, check=True):
              return subprocess.run(cmd, text=True, capture_output=True, check=check)


          def gh(*args, check=True):
              return run(["gh", *args], check=check)


          def gh_app(*args, check=True):
              # Same CLI, the app's identity: this is what can write to a PR-only branch.
              environment = dict(os.environ)
              environment["GH_TOKEN"] = os.environ["APP_TOKEN"]
              return subprocess.run(
                  ["gh", *args], text=True, capture_output=True, check=check, env=environment
              )


          def gh_json(*args):
              return json.loads(gh(*args).stdout)


          def error(message):
              print(f"::error::{message}")


          def parse_versions(raw):
              items = [x.strip() for x in raw.split(",") if x.strip()]
              if not items:
                  return None, "the versions input is empty"
              out = []
              for item in items:
                  if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,2}", item):
                      return None, f"invalid Minecraft version {item!r}"
                  if item in out:
                      return None, f"duplicate Minecraft version {item!r}"
                  out.append(item)
              return out, None


          def branch_exists(name):
              return run(
                  ["git", "ls-remote", "--exit-code", "--heads", "origin", f"refs/heads/{name}"],
                  check=False,
              ).returncode == 0


          def tag_exists(tag):
              return run(
                  ["git", "ls-remote", "--exit-code", "--tags", "origin", f"refs/tags/{tag}"],
                  check=False,
              ).returncode == 0


          def remote_file(ref, path):
              result = gh(
                  "api",
                  f"repos/{REPO}/contents/{path}?ref={ref}",
                  "-H",
                  "Accept: application/vnd.github.raw",
                  check=False,
              )
              return result.stdout if result.returncode == 0 else None


          def blob_sha(ref, path):
              result = gh(
                  "api",
                  f"repos/{REPO}/contents/{path}?ref={ref}",
                  "--jq",
                  ".sha",
                  check=False,
              )
              return result.stdout.strip() if result.returncode == 0 else None


          def head_sha(branch):
              result = run(["git", "ls-remote", "origin", f"refs/heads/{branch}"], check=False)
              return result.stdout.split()[0] if result.stdout.strip() else None


          CHORE_WORKFLOW = "post-merge-screenshot-sync.yml"


          def active_chore(mc):
              # A product without screenshots does not ship the chore at all, and `gh run list`
              # fails on a workflow name the repository does not have. Nothing to wait for then.
              result = gh(
                  "run", "list", "--repo", REPO, "--workflow", CHORE_WORKFLOW,
                  "--branch", f"{mc}/development", "--limit", "20",
                  "--json", "databaseId,status,conclusion,url",
                  check=False,
              )
              if result.returncode != 0:
                  return []
              runs = json.loads(result.stdout)
              return [run for run in runs if run["status"] != "completed"]


          def wait_for_chore(mc, timeout_minutes=60):
              # The post-merge chore is the only other writer on <mc>/development, and it writes the
              # "closed in `<mc>` by PR #" comment the issue step below looks for. Reading the
              # version, bumping it or promoting it while the chore runs would race its commit (the
              # contents API write fails against a stale sha) or promote a tree it is about to
              # change, so a version's work waits for it to finish first.
              deadline = time.monotonic() + timeout_minutes * 60
              announced = set()
              while True:
                  running = active_chore(mc)
                  if not running:
                      return True
                  for run in running:
                      if run["databaseId"] not in announced:
                          announced.add(run["databaseId"])
                          print(
                              f"::notice::waiting for the post-merge chore on {mc}/development "
                              f"(run {run['databaseId']}, {run['status']}): {run['url']}"
                          )
                  if time.monotonic() >= deadline:
                      print(
                          f"::error::the post-merge chore on {mc}/development was still running "
                          f"after {timeout_minutes} minutes"
                      )
                      return False
                  time.sleep(15)


          def project_version(ref):
              text = remote_file(ref, "build.gradle.kts")
              if not text:
                  return None
              match = re.search(r'^version[ \t]*=[ \t]*"(.*)"[ \t]*$', text, re.M)
              return match.group(1) if match else None


          def bumped(version, part):
              parts = [int(x) for x in version.split(".")]
              while len(parts) < 3:
                  parts.append(0)
              major, minor, patch = parts[0], parts[1], parts[2]
              if part == "major":
                  return f"{major + 1}.0.0"
              if part == "minor":
                  return f"{major}.{minor + 1}.0"
              return f"{major}.{minor}.{patch + 1}"


          def changelog_notes(ref):
              text = remote_file(ref, "CHANGELOG.md")
              if not text:
                  return None
              lines = text.splitlines()
              index = 0
              in_comment = False
              while index < len(lines):
                  line = lines[index].strip()
                  if in_comment:
                      in_comment = "-->" not in line
                      index += 1
                      continue
                  if not line:
                      index += 1
                      continue
                  if line.startswith("<!--"):
                      in_comment = "-->" not in line
                      index += 1
                      continue
                  if line.startswith("# "):
                      index += 1
                      continue
                  break
              return "\n".join(lines[index:]).strip() or None


          def last_tag(mc):
              result = run(
                  [
                      "git",
                      "for-each-ref",
                      "--sort=-creatordate",
                      "--format=%(refname:short)",
                      f"refs/tags/{mc}/*",
                  ],
                  check=False,
              )
              tags = [tag for tag in result.stdout.split() if tag]
              return tags[0] if tags else None


          def commits_since(mc):
              tag = last_tag(mc)
              revision_range = f"{tag}..origin/{mc}/development" if tag else f"origin/{mc}/development"
              return run(
                  ["git", "log", "--oneline", "--no-merges", revision_range], check=False
              ).stdout.strip()


          def open_pr(mc):
              found = gh_json(
                  "pr", "list", "--repo", REPO, "--base", f"{mc}/main", "--head",
                  f"{mc}/development", "--state", "open", "--json", "number,url",
              )
              return found[0]["number"] if found else None


          def ensure_label(name):
              gh(
                  "label", "create", name, "--color", "5319E7",
                  "--description", "Release promotion PR", check=False,
              )


          def write_version(mc, version):
              current = json.loads(
                  gh_app("api", f"repos/{REPO}/contents/build.gradle.kts?ref={mc}/development").stdout
              )
              import base64

              text = base64.b64decode(current["content"]).decode("utf-8")
              found = re.search(r'^version[ \t]*=[ \t]*"(.*)"[ \t]*$', text, re.M)
              previous = found.group(1) if found else None
              updated = re.sub(
                  r'^version[ \t]*=[ \t]*".*"[ \t]*$',
                  f'version = "{version}"',
                  text,
                  count=1,
                  flags=re.M,
              )
              if updated == text:
                  return False
              payload = {
                  "message": f"Bump to {version}",
                  "content": base64.b64encode(updated.encode("utf-8")).decode(),
                  "sha": current["sha"],
                  "branch": f"{mc}/development",
              }
              with open("/tmp/version.json", "w", encoding="utf-8") as handle:
                  json.dump(payload, handle)
              gh_app(
                  "api", "-X", "PUT", f"repos/{REPO}/contents/build.gradle.kts",
                  "--input", "/tmp/version.json",
              )
              if previous:
                  BUMPS.append((mc, previous))
              return True


          def create_main(mc):
              sha = head_sha(f"{mc}/development")
              if not sha:
                  return False
              gh(
                  "api", "-X", "POST", f"repos/{REPO}/git/refs",
                  "-f", f"ref=refs/heads/{mc}/main", "-f", f"sha={sha}",
              )
              return True


          def main():
              versions, parse_error = parse_versions(RAW)
              if parse_error:
                  error(parse_error)
                  return 1
              if BUMP not in ("major", "minor", "patch"):
                  error(f"invalid bump {BUMP!r}")
                  return 1

              errors = []
              rows = []
              for mc in versions:
                  dev = f"{mc}/development"
                  if not branch_exists(dev):
                      print(f"::notice::{dev} does not exist - skipping this version")
                      rows.append({"mc": mc, "status": "skipped: no development branch"})
                      continue
                  if not wait_for_chore(mc):
                      errors.append(f"{dev}: the post-merge chore did not finish in 60 minutes")
                      rows.append({"mc": mc, "status": "blocked: chore still running"})
                      continue
                  main_exists = branch_exists(f"{mc}/main")
                  current = project_version(dev)
                  if not current:
                      errors.append(f"{dev}: could not read the root project version")
                      continue
                  version = bumped(current, BUMP)
                  notes = changelog_notes(dev)
                  if not notes:
                      errors.append(f"{dev}: CHANGELOG.md has no pending release notes")
                  tag = f"{mc}/v{version}"
                  if tag_exists(tag):
                      errors.append(f"{tag}: tag already exists")
                  # The API document the released lines have to agree on. A product without one
                  # says so in its metadata (`release.docs: false`); the default leaves every other
                  # consumer's requirement exactly as it was.
                  meta = {}
                  meta_text = remote_file(dev, ".github/metadata.json")
                  if meta_text:
                      try:
                          meta = json.loads(meta_text)
                      except ValueError:
                          meta = {}
                  docs_path = (meta.get("release") or {}).get("docs", "docs/lua-api.md")
                  rows.append(
                      {
                          "mc": mc,
                          "status": "planned",
                          "current": current,
                          "version": version,
                          "notes": notes,
                          "main_exists": main_exists,
                          "docs": blob_sha(dev, docs_path) if docs_path else None,
                          "docs_path": docs_path or "",
                          "commits": commits_since(mc),
                      }
                  )

              planned = [row for row in rows if row["status"] == "planned"]
              if not planned:
                  errors.append("no selected version has a development branch to release")

              declared = {row["mc"]: row["version"] for row in planned}
              if len(set(declared.values())) > 1:
                  detail = ", ".join(f"{mc}={version}" for mc, version in declared.items())
                  errors.append(
                      f"root project version differs across the branches being released ({detail});"
                      " refusing to release"
                  )

              documented = {row["mc"]: row["docs"] for row in planned if row["docs"]}
              required_docs = {row["mc"]: row["docs_path"] for row in planned if row["docs_path"]}
              docs_name = next(iter(required_docs.values()), "")
              if len(set(documented.values())) > 1:
                  detail = ", ".join(f"{mc}={sha[:8]}" for mc, sha in documented.items())
                  errors.append(f"{docs_name} differs across versions ({detail}); refusing to release")
              elif required_docs and not documented:
                  errors.append(f"{docs_name} is missing on the selected branches")

              if errors:
                  for message in errors:
                      error(message)
                  for row in rows:
                      print(f'{row["mc"]}: {row["status"]}')
                  return 1

              if not DRY:
                  ensure_label("release")

              for row in planned:
                  mc = row["mc"]
                  if DRY:
                      print(f'would release {mc} v{row["version"]} (from {row["current"]})')
                      if row["main_exists"]:
                          print(f'  would open {mc}/development -> {mc}/main')
                      else:
                          print(f'  would create {mc}/main from {mc}/development and release it')
                      continue

                  write_version(mc, row["version"])
                  if row["main_exists"]:
                      body = (
                          f'## Release {mc} v{row["version"]}\n\n'
                          f'{row["notes"]}\n\n'
                          f'### Commits\n\n```\n{row["commits"]}\n```\n'
                      )
                      number = open_pr(mc)
                      with open("/tmp/pr-body.md", "w", encoding="utf-8") as handle:
                          handle.write(body)
                      if number:
                          gh(
                              "pr", "edit", str(number), "--repo", REPO,
                              "--body-file", "/tmp/pr-body.md",
                          )
                      else:
                          created = gh(
                              "pr", "create", "--repo", REPO,
                              "--base", f"{mc}/main", "--head", f"{mc}/development",
                              "--title", f"Release {mc} v{row['version']}",
                              "--body-file", "/tmp/pr-body.md", "--label", "release",
                          ).stdout.strip()
                          number = int(created.rstrip("/").split("/")[-1])
                      row["pr"] = number
                      # The bump is carried by a PR that outlives this run, so a failure later in
                      # this job must not undo it.
                      BUMPS[:] = [item for item in BUMPS if item[0] != mc]
                      print(f'promotion PR #{number} for {mc} v{row["version"]}')
                  else:
                      create_main(mc)
                      row["pr"] = None
                      BUMPS[:] = [item for item in BUMPS if item[0] != mc]
                      print(f'created {mc}/main from {mc}/development for v{row["version"]}')

              with open("/tmp/plan.json", "w", encoding="utf-8") as handle:
                  json.dump(planned if not DRY else rows, handle)

              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write("| MC version | Current | Next | Promotion |\n|---|---|---|---|\n")
                      for row in planned:
                          target = (
                              "(dry run)"
                              if DRY
                              else (f'#{row["pr"]}' if row.get("pr") else "created main")
                          )
                          handle.write(
                              f'| {row["mc"]} | {row["current"]} | {row["version"]} | {target} |\n'
                          )
              return 0


          try:
              sys.exit(main())
          except Exception as exc:
              # A version write already landed on a PR-only branch; put it back before the job fails,
              # so the next dispatch starts from the version this one found.
              print(f"::error::prepare failed: {exc}")
              pending, BUMPS[:] = list(BUMPS), []
              for mc, previous in pending:
                  try:
                      write_version(mc, previous)
                      print(
                          f"::warning::{mc}/development: version {previous} put back; the failed "
                          "prepare would otherwise have left it incremented with nothing released"
                      )
                  except Exception as restore_error:
                      print(
                          f"::error::{mc}/development: the version stays incremented; restoring "
                          f"{previous} failed: {restore_error}"
                      )
              raise
          PY
          echo "plan=$(jq -c . /tmp/plan.json)" >> "$GITHUB_OUTPUT"

  release:
    name: Merge, tag, publish
    needs: prepare
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Gradle needs a JVM it supports; the runner's default is whatever the image happens to ship
      # (JDK 25 broke the 1.18.2/1.19.2 release on a Gradle 8.10 build). A line states its own JDK
      # in `.github/metadata.json`, the same field the matrix builds with, and one job can only set up
      # one JDK before the loop - so the lines being released must agree, like `docs/lua-api.md`.
      #
      # The JDK is read from the promotion's *source*, not from `main`: this step runs before the
      # promotion PR is merged, and a line whose `main` predates `.github/metadata.json` - one that
      # has never been promoted since the file was added - would otherwise fail here and never reach
      # the merge that brings it over. After the merge both branches hold the same file anyway.
      - name: Read the JDK
        id: jdk
        env:
          PLAN: ${{ needs.prepare.outputs.plan }}
        run: |
          set -euo pipefail
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          values="$(jq -r '.[].mc' <<<"$PLAN" | while read -r mc; do
            git show "origin/$mc/development:.github/metadata.json" | jq -r '.build.jdk // 17'
          done | sort -u)"
          count="$(grep -c . <<<"$values" || true)"
          if [[ "$count" != "1" ]]; then
            echo "::error::the released lines do not name one JDK (found: $(tr '\n' ' ' <<<"$values")); refusing to build one release with several"
            exit 1
          fi
          echo "jdk=$values" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.jdk.outputs.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.jdk }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mint an app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          # The merge below runs as the app, so it also needs to write pull requests.
          permission-pull-requests: write

      - name: Merge the promotion PRs
        env:
          # The app's token, not `github.token`: a merge made with GITHUB_TOKEN pushes the merge
          # commit without a push event, so `<mc>/main` never gets the post-merge shared checks the
          # dispatcher's promotion rule counts on ("main validates again on the post-merge push").
          # A push made by an app starts workflows like any other push.
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PLAN: ${{ needs.prepare.outputs.plan }}
        run: |
          set -euo pipefail
          # Abort everything on the first failure: versions are processed in the input order and a
          # later version is not touched once one fails. A version whose main this run created has
          # no PR to merge - its main already carries development's head.
          #
          # Every row stays JSON and each field is read back with jq. Splitting a rendered line in
          # the shell is what lost the absent PR (tab is IFS whitespace, so read collapsed the run
          # and merged "1.1.1" instead) and what made a trailing newline decide whether an issue got
          # closed. jq is on every runner, so nothing here needs to count fields or delimiters.
          mapfile -t ROWS < <(jq -c '.[] | {mc, pr, version}' <<<"$PLAN")
          for row in "${ROWS[@]}"; do
            MC="$(jq -r '.mc' <<<"$row")"
            PR="$(jq -r '.pr // "-"' <<<"$row")"
            VERSION="$(jq -r '.version' <<<"$row")"
            if [[ "$PR" == "-" ]]; then
              echo "$MC/main was created from development - nothing to merge"
              continue
            fi
            # A merge commit, not a squash: main keeps development as a parent, so the next
            # promotion shares history with it instead of replaying every file since the last
            # squash as a change on both sides (which left the promotion PR permanently conflicted).
            gh pr merge "$PR" --repo "$REPO" --merge --delete-branch=false
            echo "merged promotion PR #$PR: $MC v$VERSION is now on $MC/main"
          done

      - name: Publish, tag and release every version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PLAN: ${{ needs.prepare.outputs.plan }}
        run: |
          set -euo pipefail
          mapfile -t ROWS < <(jq -c '.[] | {mc, version}' <<<"$PLAN")

          for row in "${ROWS[@]}"; do
            MC="$(jq -r '.mc' <<<"$row")"
            VERSION="$(jq -r '.version' <<<"$row")"
            git fetch --force --prune --tags origin
            DECLARED="$(git show "origin/$MC/main:build.gradle.kts" \
              | sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' | head -1)"
            if [[ "$DECLARED" != "$VERSION" ]]; then
              echo "::error::$MC/main declares version ${DECLARED:-none} after promotion, not $VERSION; nothing was tagged or published"
              exit 1
            fi
          done

          for row in "${ROWS[@]}"; do
            MC="$(jq -r '.mc' <<<"$row")"
            VERSION="$(jq -r '.version' <<<"$row")"
            TAG="$MC/v$VERSION"

            echo "::group::Release $TAG"
            git switch --force-create "release-$MC" "origin/$MC/main"
            # `git switch` rewrites tracked files only, so the gitignored build directory of the
            # version processed before this one is still here. Empty the staging tree so this
            # version cannot inherit another version's jars; the asset check below proves it (#52).
            rm -rf build/artifacts

            ./gradlew buildAll collectArtifacts --no-daemon --console=plain \
              -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
              -Dorg.gradle.worker.jvmargs="-Xmx2g"
            ./gradlew publish -Pminecraft_version="$MC" --no-daemon --console=plain \
              -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
              -Dorg.gradle.worker.jvmargs="-Xmx2g"

            git tag "$TAG"
            git push origin "refs/tags/$TAG"

            python3 <<'PY' > /tmp/release-notes.md
          with open("CHANGELOG.md", encoding="utf-8") as handle:
              lines = handle.read().splitlines()

          index = 0
          in_comment = False
          while index < len(lines):
              line = lines[index].strip()
              if in_comment:
                  in_comment = "-->" not in line
                  index += 1
                  continue
              if not line:
                  index += 1
                  continue
              if line.startswith("<!--"):
                  in_comment = "-->" not in line
                  index += 1
                  continue
              if line.startswith("# "):
                  index += 1
                  continue
              break

          print("\n".join(lines[index:]).strip())
          PY

            # Where this repository publishes, from its own registry entry in kirjorjos/ci: `gh`
            # today, `cf` and `modrinth` once those are wired. A target the array omits runs
            # nothing, so adding one is a registry change rather than an edit here.
            mapfile -t TARGETS < <(
              gh api "repos/kirjorjos/ci/contents/consumers.jsonl" --jq .content \
                | tr -d '\n' | base64 -d \
                | jq -r --arg repo "$REPO" 'select(.repo == $repo) | .release[]?'
            )
            if (( ${#TARGETS[@]} == 0 )); then
              echo "::error::$REPO lists no release targets in kirjorjos/ci consumers.jsonl"
              exit 1
            fi

            # Everything the staged set is judged against comes from this line's metadata: the jar
            # prefix, the variants it ships, the staging directory and the loader list. A line that
            # ships one jar and a line that ships a `-deobf` twin therefore run the same check, and
            # a second Minecraft line needs no copy of this workflow.
            META=.github/metadata.json
            if ! PREFIX="$(jq -er '.release.prefix' "$META")"; then
              echo "::error::$META names no release.prefix"
              exit 1
            fi
            ARTIFACTS="$(jq -er '.release.artifactsDir // "build/artifacts"' "$META")"
            mapfile -t VARIANTS < <(jq -r '.release.variants[]?' "$META")
            if (( ${#VARIANTS[@]} == 0 )); then
              VARIANTS=("")
            fi
            mapfile -t LOADER_IDS < <(jq -r '.loaders[]?' "$META")
            if (( ${#LOADER_IDS[@]} == 0 )); then
              echo "::error::$META names no loaders"
              exit 1
            fi

            # The staged set is checked before anything is published. One dispatch releases several
            # versions on one runner in one checkout, so the staging directory outlives the branch
            # switch, and a left-over jar from another version would otherwise be shipped (#52).
            for id in "${LOADER_IDS[@]}"; do
              for suffix in "${VARIANTS[@]}"; do
                expected="$ARTIFACTS/$PREFIX$id-$MC-$VERSION$suffix.jar"
                if [[ ! -f "$expected" ]]; then
                  echo "::error::$TAG is missing $(basename "$expected")"
                  exit 1
                fi
              done
            done
            for staged in "$ARTIFACTS"/*.jar; do
              name="$(basename "$staged")"
              wanted=false
              for id in "${LOADER_IDS[@]}"; do
                for suffix in "${VARIANTS[@]}"; do
                  if [[ "$name" == "$PREFIX$id-$MC-$VERSION$suffix.jar" ]]; then
                    wanted=true
                  fi
                done
              done
              if [[ "$wanted" != "true" ]]; then
                echo "::error::$name in $ARTIFACTS does not belong to $TAG"
                exit 1
              fi
            done

            find "$ARTIFACTS" -maxdepth 1 -type f -name '*.jar' -print0 \
              | sort -z | xargs -0 sha256sum > "$ARTIFACTS/SHA256SUMS.txt"
            mapfile -t ASSETS < <(
              find "$ARTIFACTS" -maxdepth 1 -type f \
                \( -name '*.jar' -o -name 'SHA256SUMS.txt' \) -print
            )
            expected_count=$(( ${#LOADER_IDS[@]} * ${#VARIANTS[@]} + 1 ))
            if (( ${#ASSETS[@]} != expected_count )); then
              echo "::error::$TAG staged ${#ASSETS[@]} asset(s), expected $expected_count (${#VARIANTS[@]} jar(s) per loader plus SHA256SUMS.txt)"
              exit 1
            fi

            for target in "${TARGETS[@]}"; do
              case "$target" in
                gh)
                  # Both jars per loader are attached on purpose: the remapped jar is the mod, and
                  # its `-deobf` twin is the same code in development names, for reading stack
                  # traces.
                  find "$ARTIFACTS" -maxdepth 1 -type f -name '*.jar' -print0 \
                    | sort -z | xargs -0 sha256sum > "$ARTIFACTS/SHA256SUMS.txt"
                  mapfile -t ASSETS < <(
                    find "$ARTIFACTS" -maxdepth 1 -type f \
                      \( -name '*.jar' -o -name 'SHA256SUMS.txt' \) -print
                  )
                  if (( ${#ASSETS[@]} == 0 )); then
                    echo "::error::no release artifacts found in $ARTIFACTS"
                    exit 1
                  fi
                  gh release create "$TAG" --repo "$REPO" --verify-tag \
                    --title "$TAG" --notes-file /tmp/release-notes.md "${ASSETS[@]}"
                  ;;
                *)
                  # Deliberately fatal: a typo in the registry must not silently publish nowhere.
                  echo "::error::unknown release target '$target' for $REPO"
                  exit 1
                  ;;
              esac
            done

            MC="$MC" VERSION="$VERSION" python3 - <<'PY'
          import json
          import os
          import subprocess

          REPO = os.environ["REPO"]
          MC = os.environ["MC"]
          VERSION = os.environ["VERSION"]
          RELEASED = "/tmp/released.json"
          MARK = f"closed in `{MC}` by PR #"
          # `fixed-in:` is product-neutral; the `minecheck-` form is what shared CI wrote before it
          # was, and both stay readable so an issue recorded earlier still closes.
          FIXED = (f"fixed-in:{MC}", f"minecheck-fixed-in:{MC}")
          STAMP = f"closed in release `{VERSION}`"


          def gh(*args):
              return subprocess.run(
                  ["gh", *args], text=True, capture_output=True, check=True
              ).stdout


          issues = json.loads(
              gh("api", f"repos/{REPO}/issues?state=open&labels=versions/{MC}&per_page=100")
          )
          # One row per (issue, mc) this run released. The close step decides from the issue's
          # whole `versions/*` label set, so releasing one line is not enough on its own.
          released = []
          if os.path.exists(RELEASED):
              with open(RELEASED, encoding="utf-8") as handle:
                  released = json.load(handle)
          for issue in issues:
              number = issue["number"]
              comments = json.loads(
                  gh("api", f"repos/{REPO}/issues/{number}/comments?per_page=100")
              )
              found = False
              for comment in comments:
                  body = comment.get("body") or ""
                  # Two workflows record that work merged into <mc>: the post-merge chore writes
                  # "closed in `<mc>` by PR #n", and PR validation writes
                  # "<!-- fixed-in:<mc> -->". Either is something a release can close from, so an
                  # issue whose chore comment failed is not stranded open.
                  if MARK not in body and not any(marker in body for marker in FIXED):
                      continue
                  found = True
                  if STAMP in body:
                      continue
                  with open("/tmp/comment.json", "w", encoding="utf-8") as handle:
                      json.dump({"body": body + f"\n\n{STAMP}"}, handle)
                  gh(
                      "api", "-X", "PATCH",
                      f"repos/{REPO}/issues/comments/{comment['id']}",
                      "--input", "/tmp/comment.json",
                  )
                  print(f"marked #{number} released in {VERSION}")
              if found:
                  # Recorded even when the stamp was already there, so a re-run after a failed
                  # close still closes what it released.
                  released = [
                      row for row in released
                      if (row["number"], row["mc"]) != (number, MC)
                  ]
                  released.append({"number": number, "mc": MC, "version": VERSION})
          with open(RELEASED, "w", encoding="utf-8") as handle:
              json.dump(released, handle)
          PY

            echo "| $MC | $VERSION | $TAG | released |" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      - name: Close the issues every affected version has released
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Runs only after every version succeeded: the step above aborts otherwise, so an issue is
          # never closed for a release that did not finish.
          [[ -f /tmp/released.json ]] || { echo "No issue was marked released."; exit 0; }
          REPO="$REPO" python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          REPO = os.environ["REPO"]
          RELEASED = "/tmp/released.json"
          STAMP = "closed in release `"
          VERSION_OF = re.compile(r"closed in release `([^`]+)`")


          def gh(*args):
              return subprocess.run(
                  ["gh", *args], text=True, capture_output=True, check=True
              ).stdout


          with open(RELEASED, encoding="utf-8") as handle:
              touched = sorted({int(row["number"]) for row in json.load(handle)})
          summary = os.environ.get("GITHUB_STEP_SUMMARY")

          for number in touched:
              issue = json.loads(gh("api", f"repos/{REPO}/issues/{number}"))
              # Every version the issue claims, not just the line this run released.
              labelled = sorted(
                  {
                      label["name"].split("/", 1)[1]
                      for label in issue["labels"]
                      if label["name"].startswith("versions/")
                  }
              )
              bodies = [
                  comment.get("body") or ""
                  for comment in json.loads(
                      gh("api", f"repos/{REPO}/issues/{number}/comments?per_page=100")
                  )
              ]
              released = {}
              pending = []
              for mc in labelled:
                  # A marker names one line, and its stamp is appended to the comment carrying it,
                  # so "this line's marker sits in a stamped comment" means that fix has shipped.
                  markers = (
                      f"closed in `{mc}` by PR #",
                      f"fixed-in:{mc}",
                      f"minecheck-fixed-in:{mc}",
                  )
                  stamped = [
                      body for body in bodies
                      if any(marker in body for marker in markers) and STAMP in body
                  ]
                  if not stamped:
                      pending.append(mc)
                      continue
                  versions = VERSION_OF.findall(stamped[-1])
                  released[mc] = versions[-1] if versions else None
              if pending:
                  # Closing here would claim a version that has not shipped, and the merge that
                  # fills the gap would then land on a closed issue nobody reads.
                  print(f"#{number} stays open: {', '.join(pending)} not released")
                  if summary:
                      with open(summary, "a", encoding="utf-8") as handle:
                          handle.write(f"| #{number} | left open | {', '.join(pending)} |\n")
                  continue
              detail = ", ".join(
                  f"{mc} in `{version}`" if version else mc
                  for mc, version in sorted(released.items())
              )
              body = "Closing: every affected Minecraft version has been released"
              body += f" ({detail})." if detail else "."
              with open("/tmp/comment.json", "w", encoding="utf-8") as handle:
                  json.dump({"body": body}, handle)
              gh("api", f"repos/{REPO}/issues/{number}/comments", "--input", "/tmp/comment.json")
              gh("api", f"repos/{REPO}/issues/{number}", "-X", "PATCH", "-f", "state=closed")
              print(f"closed #{number}")
          PY

      # development is PR-only, so resetting the scratchpad needs a token that can bypass the
      # `Version development` ruleset: the CI App is the bypass actor. The reset lands on
      # development, so main keeps the released notes until the next promotion replaces them.
      - name: Clear the pending release notes
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PLAN: ${{ needs.prepare.outputs.plan }}
        run: |
          set -euo pipefail
          PLAN="$PLAN" python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          from urllib.parse import quote

          REPO = os.environ["REPO"]
          plan = json.loads(os.environ["PLAN"])


          def gh(*args):
              return subprocess.run(
                  ["gh", *args], text=True, capture_output=True, check=True
              ).stdout


          def header_only(text):
              out = []
              in_comment = False
              for line in text.splitlines():
                  stripped = line.strip()
                  if in_comment:
                      out.append(line)
                      if "-->" in stripped:
                          in_comment = False
                      continue
                  if stripped.startswith("<!--"):
                      out.append(line)
                      in_comment = "-->" not in stripped
                      continue
                  if not stripped or stripped.startswith("# "):
                      out.append(line)
                      continue
                  break
              return "\n".join(out).rstrip() + "\n"


          for item in plan:
              mc, version = item["mc"], item["version"]
              branch = f"{mc}/development"
              current = json.loads(
                  gh("api", f"repos/{REPO}/contents/CHANGELOG.md?ref={quote(branch, safe='')}")
              )
              text = base64.b64decode(current["content"]).decode("utf-8")
              cleared = header_only(text)
              if text.rstrip() == cleared.rstrip():
                  print(f"{branch}: changelog already clear")
                  continue
              with open("/tmp/changelog-reset.json", "w", encoding="utf-8") as handle:
                  json.dump(
                      {
                          "message": f"Clear the release notes after {mc}/v{version}",
                          "content": base64.b64encode(cleared.encode("utf-8")).decode(),
                          "sha": current["sha"],
                          "branch": branch,
                      },
                      handle,
                  )
              gh(
                  "api", "-X", "PUT", f"repos/{REPO}/contents/CHANGELOG.md",
                  "--input", "/tmp/changelog-reset.json",
              )
              print(f"{branch}: release notes cleared after v{version}")
          PY
