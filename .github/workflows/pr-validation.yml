# generated by kirjorjos/ci - do not edit; this file is overwritten on the next sync.
#
# The pull request's check matrix: wait for the shared rules verdict, take this version line's test
# slot, run `ci.yml` on the pull request's head, hand the slot back, and report the single
# `Merge gate` check a ruleset requires.
name: PR validation

# The check matrix for a pull request: wait for this version line's slot, run the suite on the pull
# request's head, hand the slot back. It lives here rather than in the shared repository because the
# required context has to be reported by the pull request's own run - a dispatched run's checks
# attach to the default branch and could never satisfy it.
#
# The pull request's *shape* is not judged here any more: `rules` in kirjorjos/ci does that, on
# `pull_request_target`, so an invalid PR is commented on and closed by one implementation rather
# than two. Its verdict is the `Validate PR rules` check this workflow waits for below.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  # The slot: one matrix at a time per version line. This job is the *wait*, not the launcher.
  # The matrix has to run inside this pull request's own `pull_request_target` run, because that is
  # the only run whose checks attach to the PR head.
  slot:
    name: Wait for the slot
    # A `*/main` promotion never reaches the shared CI (its dispatcher resolves no types for one),
    # so there is no rules check to wait for and no suite to run: `development` was already tested.
    if: >-
      github.event.pull_request.draft == false &&
      !endsWith(github.event.pull_request.base.ref, '/main')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      checks: write
      pull-requests: write
    outputs:
      mc: ${{ steps.take.outputs.mc }}
    steps:
      - name: Wait for the shared rules check
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Matched by suffix: the check reports as `Validate PR rules` here, because the caller is
          # this repository's synced entry file and the name keeps only the innermost job - but a
          # deeper nesting would arrive as `<job> / Validate PR rules`, and neither shape is worth
          # pinning. An earlier `/ Validate PR rules` test matched nothing at all.
          for _ in $(seq 1 60); do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name | endswith("Validate PR rules"))]' 2> /dev/null || echo '[]')
            [[ -n "$runs" ]] || runs='[]'

            # A skipped check is not a verdict. The `pull_request` dispatch also reaches the Rules
            # job on this SHA, and it skips there because that type is gated to
            # `pull_request_target`; treating that skip as a failure failed the gate before the run
            # that actually judges the PR finished. Only a real verdict counts.
            if jq -e 'any(.[]; .status == "completed" and
              (.conclusion == "failure" or .conclusion == "cancelled"
               or .conclusion == "timed_out" or .conclusion == "action_required"))' <<<"$runs" > /dev/null; then
              echo "::error::the shared PR rules check did not pass; no suite runs for this PR"
              exit 1
            fi
            if jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' <<<"$runs" > /dev/null; then
              echo "The shared PR rules check passed."
              exit 0
            fi
            sleep 10
          done

          echo "::error::the shared PR rules check never appeared; kirjorjos/ci is not dispatching 'rules' for this repository"
          exit 1

      - name: Mint an app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      # The run's own `pull_requests` array is empty for this event, so the only reliable way to
      # tell a downstream workflow which pull request this run belongs to is an artifact written
      # here, before the (possibly 90-minute) wait.
      - name: Publish the slot context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/slot-context"
          jq -n --arg pr "$PR_NUMBER" --arg sha "$SHA" --arg target "$BASE" --arg mc "${BASE%%/*}" \
            '{pr: ($pr | tonumber), sha: $sha, target: $target, mc: $mc}' \
            > "$RUNNER_TEMP/slot-context/pr.json"
          cat "$RUNNER_TEMP/slot-context/pr.json"

      - name: Upload the slot context
        uses: actions/upload-artifact@v4
        with:
          name: slot-context
          path: ${{ runner.temp }}/slot-context/pr.json
          retention-days: 7

      - name: Take a place in the queue and wait for the grant
        id: take
        uses: kirjorjos/ci/minecraft-mods/types/slot/run@minecraft-mods/v3
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          mode: take
          pr: ${{ github.event.pull_request.number }}
          sha: ${{ github.event.pull_request.head.sha }}
          target: ${{ github.event.pull_request.base.ref }}
          compare: ${{ github.event.pull_request.base.ref }}
          fork: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          head-repo: ${{ github.event.pull_request.head.repo.full_name }}

  ci:
    name: Build + tests
    needs: [slot]
    if: needs.slot.result == 'success'
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: refs/pull/${{ github.event.pull_request.number }}/head
      compare_baselines: ${{ github.event.pull_request.base.ref }}

  # `always()` so a failed or cancelled matrix still hands the slot on; the lease is only the
  # backstop for a run that dies outright.
  release:
    name: Release the slot
    needs: [slot, ci]
    if: always() && needs.slot.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      checks: write
    steps:
      - name: Mint an app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Give the slot back
        uses: kirjorjos/ci/minecraft-mods/types/slot/run@minecraft-mods/v3
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          mode: release
          pr: ${{ github.event.pull_request.number }}
          sha: ${{ github.event.pull_request.head.sha }}
          target: ${{ github.event.pull_request.base.ref }}

  # The one check a ruleset requires, so the merge decision is CI's rather than a reader's. Without
  # it the two worst outcomes leave nothing red to require: a rejected branch name fails the rules
  # check, which fails `slot`, which makes `ci` *skipped* - and a skipped job is not a pass, so the
  # pull request showed two red by-products and no failing suite while GitHub called it mergeable.
  # This job folds every way this run can fail into one context that is red whenever any is.
  gate:
    name: Merge gate
    needs: [slot, ci]
    # Mirrors `slot`: a draft carries no verdict yet, and a `*/main` promotion is not this matrix's
    # business - it was tested on its development line and is merged by the release job.
    if: >-
      always() &&
      github.event.pull_request.draft == false &&
      !endsWith(github.event.pull_request.base.ref, '/main')
    runs-on: ubuntu-22.04
    steps:
      - name: Require the rules verdict and every suite
        run: |
          set -euo pipefail
          echo "slot=${{ needs.slot.result }} ci=${{ needs.ci.result }}"
          if [[ "${{ needs.slot.result }}" != "success" ]]; then
            echo "::error::this pull request never reached a suite: the slot gate ended ${{ needs.slot.result }} (a rejected rules verdict fails it, and a skipped matrix is not a pass)"
            exit 1
          fi
          if [[ "${{ needs.ci.result }}" != "success" ]]; then
            echo "::error::the build matrix did not pass (${{ needs.ci.result }}); every loader has to be green"
            exit 1
          fi
          echo "The rules verdict passed and every loader's suite is green."
