name: PR validation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  rules:
    name: Validate PR rules
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      valid: ${{ steps.rules.outputs.valid }}
      target_type: ${{ steps.rules.outputs.target_type }}
      target_version: ${{ steps.rules.outputs.target_version }}
      source_issue: ${{ steps.rules.outputs.source_issue }}
      run_ci: ${{ steps.rules.outputs.run_ci }}
    steps:
      - name: Validate branch rules
        id: rules
        env:
          ACTION: ${{ github.event.action }}
          TARGET: ${{ github.event.pull_request.base.ref }}
          SOURCE: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Branch grammar (.notes/branching-versioning-migration-spec.md §4.1):
          #   <version>/main | <version>/development | everything else
          # <version> admits two-part MC versions (1.8, 1.19, 26.1) and three-part ones (1.19.2).
          # Anything that is neither <version>/development nor <version>/main is a plain
          # contribution target (issue, collation or feature branch) and is never closed for its
          # shape — see .notes/ci-structure-spec.md S21.
          VALID="true"
          REASON=""
          TARGET_TYPE=""
          TARGET_VERSION=""
          SOURCE_KIND=""
          SOURCE_VERSION=""
          SOURCE_ISSUE=""

          if [[ "$TARGET" =~ ^([0-9]+(\.[0-9]+){1,2})/development-issue-[0-9]+$ ]]; then
            TARGET_TYPE="issue"
            TARGET_VERSION="${BASH_REMATCH[1]}"
          elif [[ "$TARGET" =~ ^([0-9]+(\.[0-9]+){1,2})/development$ ]]; then
            TARGET_TYPE="development"
            TARGET_VERSION="${BASH_REMATCH[1]}"
          elif [[ "$TARGET" =~ ^([0-9]+(\.[0-9]+){1,2})/main$ ]]; then
            TARGET_TYPE="main"
            TARGET_VERSION="${BASH_REMATCH[1]}"
          else
            TARGET_TYPE="other"
          fi

          if [[ "$SOURCE" =~ ^([0-9]+(\.[0-9]+){1,2})/development-issue-([0-9]+)$ ]]; then
            SOURCE_KIND="issue"
            SOURCE_VERSION="${BASH_REMATCH[1]}"
            SOURCE_ISSUE="${BASH_REMATCH[3]}"
          elif [[ "$SOURCE" =~ ^([0-9]+(\.[0-9]+){1,2})/development$ ]]; then
            SOURCE_KIND="development"
            SOURCE_VERSION="${BASH_REMATCH[1]}"
          fi

          if [[ "$ACTION" != "closed" ]]; then
            case "$TARGET_TYPE" in
              issue | other)
                # Anything may open a PR into an issue, collation or feature branch.
                ;;
              development)
                if [[ "$SOURCE_KIND" != "issue" ]]; then
                  VALID="false"
                  REASON="Source branch \`$SOURCE\` is not \`<version>/development-issue-{issue}\`."
                elif [[ "$SOURCE_VERSION" != "$TARGET_VERSION" ]]; then
                  VALID="false"
                  REASON="Source version \`$SOURCE_VERSION\` does not match target version \`$TARGET_VERSION\`."
                fi
                ;;
              main)
                # main is release-only: bot-authored, same repository, from that version's development line.
                if [[ "$AUTHOR" != "github-actions[bot]" ]]; then
                  VALID="false"
                  REASON="\`<version>/main\` only accepts pull requests opened by the release workflow (author \`github-actions[bot]\`), not by \`$AUTHOR\`."
                elif [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
                  VALID="false"
                  REASON="\`<version>/main\` only accepts releases from \`$BASE_REPO\`; PRs from \`$HEAD_REPO\` are rejected."
                elif [[ "$SOURCE_KIND" != "development" ]]; then
                  VALID="false"
                  REASON="Source branch \`$SOURCE\` is not \`<version>/development\`."
                elif [[ "$SOURCE_VERSION" != "$TARGET_VERSION" ]]; then
                  VALID="false"
                  REASON="Source version \`$SOURCE_VERSION\` does not match target version \`$TARGET_VERSION\`."
                fi
                ;;
            esac
          fi

          # Promotion PRs skip the suite: development already passed the full gate, and a
          # GITHUB_TOKEN-authored PR cannot report a required check anyway.
          if [[ "$ACTION" == "closed" || "$TARGET_TYPE" == "main" ]]; then
            RUN_CI="false"
          else
            RUN_CI="true"
          fi

          {
            echo "valid=$VALID"
            echo "reason=$REASON"
            echo "target_type=$TARGET_TYPE"
            echo "target_version=$TARGET_VERSION"
            echo "source_issue=$SOURCE_ISSUE"
            echo "run_ci=$RUN_CI"
          } >> "$GITHUB_OUTPUT"

      - name: Note an ungated target
        if: >-
          steps.rules.outputs.valid == 'true' &&
          steps.rules.outputs.target_type == 'other' &&
          github.event.action != 'closed'
        run: |
          {
            echo "### Ungated target"
            echo ""
            echo "\`${{ github.event.pull_request.base.ref }}\` is neither \`<version>/development\`"
            echo "nor \`<version>/main\`. This PR runs the full loader matrix, no required check"
            echo "gates it, and it is never closed for its shape."
            echo ""
            echo "Recognized gated shapes: \`<version>/development\` (from \`<version>/development-issue-<n>\`)"
            echo "and \`<version>/main\` (release workflow only)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment when the PR drops a loader
        if: >-
          steps.rules.outputs.valid == 'true' &&
          github.event.action != 'closed'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          read_loaders() {
            gh api "repos/$REPO/contents/.github/loaders.jsonl?ref=$1" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null \
              | jq -r '.id // empty' 2>/dev/null || true
          }

          base="$(read_loaders "$BASE_SHA" | sed '/^$/d' | sort -u)"
          head="$(read_loaders "$HEAD_SHA" | sed '/^$/d' | sort -u)"
          removed="$(comm -23 <(printf '%s\n' "$base") <(printf '%s\n' "$head") | sed '/^$/d')"
          if [[ -z "$removed" ]]; then
            echo "No loader was removed."
            exit 0
          fi

          marker='<!-- loaders-removed -->'
          if gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[].body' \
            | grep -F "$marker" >/dev/null; then
            echo "Already announced a loader removal."
            exit 0
          fi

          body="$marker
          This PR removes $(wc -l <<<"$removed" | tr -d ' ') loader(s) from \`.github/loaders.jsonl\`, so CI will run fewer jobs:

          $(printf -- '- `%s`\n' $removed)

          Confirm this is intentional before merging."

          jq -n --arg body "$body" '{body: $body}' \
            | gh api "repos/$REPO/issues/$PR_NUMBER/comments" --input - >/dev/null
          echo "Announced the removal of: $(tr '\n' ' ' <<<"$removed")"

      - name: Comment and close invalid PR
        if: steps.rules.outputs.valid == 'false' && github.event.action != 'closed'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.rules.outputs.reason }}
        run: |
          set -euo pipefail
          BODY="$(jq -nr --arg reason "$REASON" '
            "**This pull request was automatically closed by CI validation.**\n\n" +
            "**Reason:** \($reason)\n\n" +
            "Branch model:\n" +
            "- `<version>/development-issue-<n>` — work branch; any source, relevant tests must pass\n" +
            "- `<version>/development` — source: `<version>/development-issue-<n>` of the same version; full test suite\n" +
            "- `<version>/main` — release workflow only (bot-authored, same repository, from `<version>/development`)\n" +
            "- any other branch — feature or collation branch; any source, gated by nothing\n\n" +
            "See `.notes/branching-versioning-migration-spec.md` for the full model.\n"
          ')"
          jq -n --arg body "$BODY" '{body: $body}' \
            | gh api "repos/$REPO/issues/$PR_NUMBER/comments" --input -
          gh api "repos/$REPO/pulls/$PR_NUMBER" -X PATCH -f state=closed
          exit 1

      - name: Mark fixed in development
        if: >-
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          steps.rules.outputs.target_type == 'development'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ steps.rules.outputs.target_version }}
          SOURCE_ISSUE: ${{ steps.rules.outputs.source_issue }}
          SOURCE: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -n "$SOURCE_ISSUE" ]]; then
            MARKER="minecheck-fixed-in:$VERSION"
            gh api "repos/$REPO/issues/$SOURCE_ISSUE/comments" --paginate --jq '.[].body' > /tmp/issue-comments.txt
            if ! grep -F "$MARKER" /tmp/issue-comments.txt >/dev/null; then
              BODY="$(jq -nr --arg version "$VERSION" --arg pr "$PR_NUMBER" '
                "Fixed in **\($version)** via PR #\($pr). <!-- minecheck-fixed-in:\($version) -->"
              ')"
              jq -n --arg body "$BODY" '{body: $body}' \
                | gh api "repos/$REPO/issues/$SOURCE_ISSUE/comments" --input -
            else
              echo "Issue #$SOURCE_ISSUE already records $MARKER"
            fi
            echo "Issue #$SOURCE_ISSUE will close when every affected version is released."
          fi

          # Defensive head-branch cleanup; the repository setting also deletes merged heads.
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$SOURCE" 2>/dev/null \
              && echo "Deleted merged head branch $SOURCE" \
              || echo "::notice::head branch $SOURCE was already deleted"
          fi

  ci:
    name: Build + tests
    needs: rules
    if: >-
      needs.rules.outputs.valid == 'true' &&
      needs.rules.outputs.run_ci == 'true' &&
      github.event.action != 'closed'
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: refs/pull/${{ github.event.pull_request.number }}/head
      compare_baselines: ${{ github.event.pull_request.base.ref }}
