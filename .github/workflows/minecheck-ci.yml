# generated by kirjorjos/ci - do not edit; this file is overwritten on the next sync.
#
# It is identical in every consumer on purpose: it knows nothing about which checks this repository
# runs. The dispatcher in kirjorjos/ci reads consumers.jsonl and decides that.
#
# Issue and comment events are here for the types that judge an issue (`issues`), not for the ones
# that judge a pull request; each type workflow gates itself on the event that produced it.
#
# `pull_request_target` is here for the types that must act on the pull request itself (`rules`:
# comment, close). It runs in the base repository's context, so its token can write on a fork's
# pull request; those types are gated to this event alone so nothing runs twice per push.
name: Shared CI
on:
  # No `closed`: the run GitHub starts for a closing pull request has no jobs at all and is reported
  # as a failed run, which is what every promotion PR left behind on the branch it promoted. Nothing
  # needs that event - the checks belong to a pull request that still has commits to judge, and the
  # post-merge push is what validates the branch afterwards. `pull_request_target` keeps `closed`
  # because the rules type acts on a pull request closing.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  push:
    branches:
      - "*/development"
      - "*/main"
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write
jobs:
  dispatch:
    uses: kirjorjos/ci/.github/workflows/dispatch.yml@minecraft-mods/v3
