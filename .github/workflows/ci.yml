name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      gradle_tasks:
        description: Gradle tasks to run (space-separated). Defaults to the full chain.
        required: false
        type: string
        default: test
      compare_baselines:
        description: Branch whose tests/baselines/ to compare screenshots against. Empty means the checked-out ref.
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      gradle_tasks:
        description: Gradle tasks to run (space-separated). Defaults to the full chain.
        required: false
        type: string
        default: test
      checkout_ref:
        description: Git ref to check out. Empty means the branch the run is on.
        required: false
        type: string
        default: ''
      compare_baselines:
        description: Branch whose tests/baselines/ to compare screenshots against. Empty means the checked-out ref.
        required: false
        type: string
        default: ''

jobs:
  lifecycle:
    name: Build + lifecycle tests (all loaders)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          allow-unsafe-pr-checkout: ${{ inputs.checkout_ref != '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Use the base branch's baselines
        if: inputs.compare_baselines != ''
        run: |
          set -euo pipefail
          BASE="${{ inputs.compare_baselines }}"
          git fetch --no-tags origin "refs/heads/$BASE:refs/remotes/origin/$BASE"
          base=$(git rev-parse "origin/$BASE")
          rm -rf tests/baselines
          if git cat-file -e "$base:tests/baselines" 2>/dev/null; then
            git checkout "$base" -- tests/baselines
          fi
          echo "Comparing screenshots against $BASE ($base)"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build + run tests
        id: build
        run: |
          set -euo pipefail
          # An event without inputs (a push, for example) leaves the task list empty, and an empty
          # Gradle task list is a green build that ran nothing.
          TASKS="${{ inputs.gradle_tasks }}"
          if [ -z "$TASKS" ]; then
            TASKS=test
          fi
          # Step 1 of the screenshot flow, on every gated run — a PR compares against its base
          # branch, a push against the branch's own committed tree. A picture that differs or is
          # missing there is a *finding*: it is listed in the PR comment and regenerated by the
          # post-merge chore, so an out-of-date baseline is never a red build. Step 2 below is the
          # only screenshot verdict this job owns.
          REPORT=""
          if [[ -n "${{ inputs.compare_baselines }}" || "${{ github.event_name }}" == "push" ]]; then
            REPORT="-Pminecheck.screenshots.report=true"
          fi
          # --continue so one failing lifecycle suite does not stop the others: the screenshot
          # suites write a missing baseline before they fail, and a bootstrapping run has to reach
          # all three of them. The step still fails on the first non-zero task result.
          ./gradlew $TASKS $REPORT --continue --no-daemon --console=plain \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.worker.jvmargs="-Xmx2g"
        timeout-minutes: 120

      - name: Save the first pass's captures
        if: always() && (github.event_name == 'push' || inputs.compare_baselines != '')
        run: |
          set -euo pipefail
          for loader in fabric forge quilt; do
            src="src/$loader/mod/run/client/screenshots"
            [[ -d "$src" ]] || continue
            mkdir -p "$RUNNER_TEMP/shots-first/$loader"
            cp -a "$src/." "$RUNNER_TEMP/shots-first/$loader/"
          done

      - name: List the baselines this run disagrees with
        id: changed
        if: always() && (github.event_name == 'push' || inputs.compare_baselines != '')
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/changed-baselines"
          # The report the shots tasks wrote in report mode: exactly the baselines the run's
          # captures diverge from, which is what the comment names and the post-merge chore
          # regenerates. Anything report mode wrote into the tree (a missing baseline) is added on
          # top.
          {
            cat build/minecheck/shots-report/*.txt 2>/dev/null || true
            git status --porcelain -- tests/baselines \
              | awk '$1 != "D" {print $NF}' \
              || true
          } | sed '/^$/d' | sort -u > "$RUNNER_TEMP/changed-baselines/changed.txt"
          if [[ -s "$RUNNER_TEMP/changed-baselines/changed.txt" ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "Every capture already matches the committed tree - nothing to rerun."
          fi
          echo "Changed baselines:"
          cat "$RUNNER_TEMP/changed-baselines/changed.txt"

      - name: Rerun the divergent captures and require the same bytes
        if: steps.changed.outputs.any == 'true'
        run: |
          set -euo pipefail
          # Step 2, the only screenshot verdict this job owns: capture again and compare against
          # pass 1 instead of the committed tree, restricted to the captures that disagreed
          # (-Pminecheck.screenshots.only). Different pixels here mean the renderer is not
          # reproducible, which no baseline update can fix; identical pixels mean the difference
          # is the committed picture, and the PR is green.
          SET="$RUNNER_TEMP/changed-baselines/changed.txt"
          SHOTS=""
          for loader in $(grep -oE 'tests/baselines/[a-z]+/' "$SET" | cut -d/ -f3 | sort -u); do
            case "$loader" in
              fabric) SHOTS="$SHOTS testFabricShots" ;;
              forge) SHOTS="$SHOTS testForgeShots" ;;
              quilt) SHOTS="$SHOTS testQuiltShots" ;;
              *) echo "::warning::Ignoring unexpected baseline path for loader '$loader'" ;;
            esac
          done
          if [[ -z "$SHOTS" ]]; then
            echo "No loader was named by the changed list - nothing to rerun."
            exit 0
          fi
          ./gradlew $SHOTS --continue --no-daemon --console=plain \
            -Pminecheck.screenshots.compareDir="$RUNNER_TEMP/shots-first" \
            -Pminecheck.screenshots.only="$SET" \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.worker.jvmargs="-Xmx2g"
        timeout-minutes: 90

      - name: Upload screenshot captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            src/*/mod/run/client/screenshots/**/*.png
            src/*/mod/run/client/screenshots/profile.json
            tests/baselines/**/*.png
            tests/baselines/**/profile.json
            tests/local-baselines/**/*.png
            tests/local-baselines/**/profile.json
            src/*/mod/run/client/config/minecheck/run-result.json
            src/*/mod/run/client/logs/latest.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the changed baseline list
        if: always() && (github.event_name == 'push' || inputs.compare_baselines != '')
        uses: actions/upload-artifact@v4
        with:
          name: changed-baselines
          path: ${{ runner.temp }}/changed-baselines/changed.txt
          retention-days: 1
          if-no-files-found: ignore
