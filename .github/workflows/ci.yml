name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      gradle_tasks:
        description: Gradle tasks to run (space-separated). Defaults to the full chain.
        required: false
        type: string
        default: test
      checkout_ref:
        description: Git ref to check out. Empty means the branch the run is on.
        required: false
        type: string
        default: ''

jobs:
  lifecycle:
    name: Build + lifecycle tests (all loaders)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          allow-unsafe-pr-checkout: ${{ inputs.checkout_ref != '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build + run tests
        run: |
          ./gradlew ${{ inputs.gradle_tasks }} --no-daemon --console=plain \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.worker.jvmargs="-Xmx2g"
        timeout-minutes: 120
