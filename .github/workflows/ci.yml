name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      compare_baselines:
        description: Branch whose tests/baselines/ to compare screenshots against. Empty means the checked-out ref.
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to check out. Empty means the branch the run is on.
        required: false
        type: string
        default: ''
      compare_baselines:
        description: Branch whose tests/baselines/ to compare screenshots against. Empty means the checked-out ref.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    outputs:
      loaders: ${{ steps.read.outputs.loaders }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          allow-unsafe-pr-checkout: ${{ inputs.checkout_ref != '' }}

      - name: Read the loader list
        id: read
        run: |
          set -euo pipefail
          file=.github/loaders.jsonl
          if [[ ! -f "$file" ]]; then
            echo "::error::$file is missing"
            exit 1
          fi
          # JSON Lines: jq -s reads one object per line into one array of them.
          if ! ids="$(jq -s -c '[.[] | .id]' "$file" 2>/dev/null)"; then
            echo "::error::$file is not valid JSON Lines"
            exit 1
          fi
          if [[ "$ids" == "[]" ]]; then
            echo "::error::$file lists no loaders"
            exit 1
          fi
          if [[ -n "$(jq -r '.[] | select(type != "string")' <<<"$ids")" ]]; then
            echo "::error::every loader entry needs a string \"id\""
            exit 1
          fi
          # The file comes from the PR's head, so a fork controls it: keep the value to an id, never
          # something that could become an arbitrary Gradle task name.
          if [[ -n "$(jq -r '.[] | select(test("^[a-z0-9][a-z0-9-]*$") | not)' <<<"$ids")" ]]; then
            echo "::error::loader ids must match [a-z0-9][a-z0-9-]*"
            exit 1
          fi
          if [[ "$(jq 'length' <<<"$ids")" != "$(jq 'unique | length' <<<"$ids")" ]]; then
            echo "::error::$file lists a loader twice"
            exit 1
          fi
          echo "loaders=$ids" >> "$GITHUB_OUTPUT"
          echo "Loaders: $ids"

  module:
    name: Formatting + plugin
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          allow-unsafe-pr-checkout: ${{ inputs.checkout_ref != '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Formatting and the plugin's own tests
        run: |
          set -euo pipefail
          ./gradlew checkModule --no-daemon --console=plain \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.worker.jvmargs="-Xmx2g"

  test:
    name: test (${{ matrix.loader }})
    needs: plan
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        loader: ${{ fromJSON(needs.plan.outputs.loaders) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          allow-unsafe-pr-checkout: ${{ inputs.checkout_ref != '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Use the base branch's baselines
        if: inputs.compare_baselines != ''
        run: |
          set -euo pipefail
          BASE="${{ inputs.compare_baselines }}"
          git fetch --no-tags origin "refs/heads/$BASE:refs/remotes/origin/$BASE"
          base=$(git rev-parse "origin/$BASE")
          rm -rf tests/baselines
          if git cat-file -e "$base:tests/baselines" 2>/dev/null; then
            git checkout "$base" -- tests/baselines
          fi
          echo "Comparing screenshots against $BASE ($base)"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Work out this loader's tasks
        id: names
        run: |
          set -euo pipefail
          loader='${{ matrix.loader }}'
          cap="$(printf '%s' "${loader:0:1}" | tr '[:lower:]' '[:upper:]')"
          echo "all=test${cap}${loader:1}All" >> "$GITHUB_OUTPUT"
          echo "shots=test${cap}${loader:1}Shots" >> "$GITHUB_OUTPUT"

      - name: Build + run tests
        id: build
        run: |
          set -euo pipefail
          # Step 1 of the screenshot flow, on every gated run — a PR compares against its base
          # branch, a push against the branch's own committed tree. A picture that differs or is
          # missing there is a *finding*: it is listed in the PR comment and regenerated by the
          # post-merge chore, so an out-of-date baseline is never a red build. Step 2 below is the
          # only screenshot verdict this job owns.
          REPORT=""
          if [[ -n "${{ inputs.compare_baselines }}" || "${{ github.event_name }}" == "push" ]]; then
            REPORT="-Pminecheck.screenshots.report=true"
          fi
          # --continue so one failing suite does not stop the others: the screenshot suite writes a
          # missing baseline before it fails, and the determinism pass needs the captures. The step
          # still fails on the first non-zero task result.
          ./gradlew ${{ steps.names.outputs.all }} $REPORT --continue --no-daemon --console=plain \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.worker.jvmargs="-Xmx2g"
        timeout-minutes: 120

      - name: Save the first pass's captures
        if: always() && (github.event_name == 'push' || inputs.compare_baselines != '')
        run: |
          set -euo pipefail
          src="src/${{ matrix.loader }}/mod/run/client/screenshots"
          [[ -d "$src" ]] || exit 0
          mkdir -p "$RUNNER_TEMP/shots-first/${{ matrix.loader }}"
          cp -a "$src/." "$RUNNER_TEMP/shots-first/${{ matrix.loader }}/"

      - name: List the baselines this loader disagrees with
        id: changed
        if: always() && (github.event_name == 'push' || inputs.compare_baselines != '')
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/changed-baselines"
          # The report the shots task wrote in report mode: exactly the baselines this loader's
          # captures diverge from. Anything report mode wrote into the tree (a missing baseline) is
          # added on top.
          {
            cat "build/minecheck/shots-report/${{ matrix.loader }}.txt" 2>/dev/null || true
            git status --porcelain -- "tests/baselines/${{ matrix.loader }}" \
              | awk '$1 != "D" {print $NF}' \
              || true
          } | sed '/^$/d' | sort -u > "$RUNNER_TEMP/changed-baselines/changed.txt"
          if [[ -s "$RUNNER_TEMP/changed-baselines/changed.txt" ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "Every capture for ${{ matrix.loader }} already matches - nothing to rerun."
          fi
          echo "Changed baselines:"
          cat "$RUNNER_TEMP/changed-baselines/changed.txt"

      - name: Rerun the divergent captures and require the same bytes
        if: steps.changed.outputs.any == 'true'
        run: |
          set -euo pipefail
          # Step 2, the only screenshot verdict this job owns: capture again and compare against
          # pass 1 instead of the committed tree, restricted to the captures that disagreed
          # (-Pminecheck.screenshots.only). Different pixels here mean the renderer is not
          # reproducible, which no baseline update can fix; identical pixels mean the difference is
          # the committed picture, and the PR is green.
          ./gradlew ${{ steps.names.outputs.shots }} --continue --no-daemon --console=plain \
            -Pminecheck.screenshots.compareDir="$RUNNER_TEMP/shots-first" \
            -Pminecheck.screenshots.only="$RUNNER_TEMP/changed-baselines/changed.txt" \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.worker.jvmargs="-Xmx2g"
        timeout-minutes: 90

      - name: Upload this loader's captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.loader }}
          path: |
            src/${{ matrix.loader }}/mod/run/client/screenshots/**/*.png
            src/${{ matrix.loader }}/mod/run/client/screenshots/profile.json
            tests/baselines/${{ matrix.loader }}/**/*.png
            tests/baselines/${{ matrix.loader }}/profile.json
            tests/local-baselines/${{ matrix.loader }}/**/*.png
            src/${{ matrix.loader }}/mod/run/client/config/minecheck/run-result.json
            src/${{ matrix.loader }}/mod/run/client/logs/latest.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the changed baseline list
        if: always() && (github.event_name == 'push' || inputs.compare_baselines != '')
        uses: actions/upload-artifact@v4
        with:
          name: changed-baselines-${{ matrix.loader }}
          path: ${{ runner.temp }}/changed-baselines/changed.txt
          retention-days: 1
          if-no-files-found: ignore

  collect:
    name: Collect
    needs: test
    if: always() && (github.event_name == 'push' || inputs.compare_baselines != '')
    runs-on: ubuntu-22.04
    steps:
      - name: Download the per-loader lists
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: changed-baselines-*
          merge-multiple: true
          path: ${{ runner.temp }}/changed

      - name: Merge them into one list
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/changed-baselines"
          if compgen -G "$RUNNER_TEMP/changed/*" >/dev/null; then
            cat "$RUNNER_TEMP"/changed/* | sed '/^$/d' | sort -u \
              > "$RUNNER_TEMP/changed-baselines/changed.txt"
          else
            : > "$RUNNER_TEMP/changed-baselines/changed.txt"
          fi
          echo "Changed baselines:"
          cat "$RUNNER_TEMP/changed-baselines/changed.txt"

      - name: Upload the changed baseline list
        uses: actions/upload-artifact@v4
        with:
          name: changed-baselines
          path: ${{ runner.temp }}/changed-baselines/changed.txt
          retention-days: 1
          if-no-files-found: ignore

  tests:
    name: Tests
    needs: [plan, module, test]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Require every loader and the module job
        run: |
          set -euo pipefail
          echo "plan=${{ needs.plan.result }} module=${{ needs.module.result }} test=${{ needs.test.result }}"
          [[ "${{ needs.plan.result }}" == "success" ]] || { echo "::error::the loader plan failed"; exit 1; }
          [[ "${{ needs.module.result }}" == "success" ]] || { echo "::error::formatting or the plugin tests failed"; exit 1; }
          [[ "${{ needs.test.result }}" == "success" ]] || { echo "::error::a loader failed"; exit 1; }
          echo "Every loader passed."
