name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      gradle_tasks:
        description: Gradle tasks to run (space-separated). Defaults to the full chain.
        required: false
        type: string
        default: test
      compare_baselines:
        description: Branch whose tests/baselines/ to compare screenshots against. Empty means the checked-out ref.
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      gradle_tasks:
        description: Gradle tasks to run (space-separated). Defaults to the full chain.
        required: false
        type: string
        default: test
      checkout_ref:
        description: Git ref to check out. Empty means the branch the run is on.
        required: false
        type: string
        default: ''
      compare_baselines:
        description: Branch whose tests/baselines/ to compare screenshots against. Empty means the checked-out ref.
        required: false
        type: string
        default: ''

jobs:
  lifecycle:
    name: Build + lifecycle tests (all loaders)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          allow-unsafe-pr-checkout: ${{ inputs.checkout_ref != '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Use the base branch's baselines
        if: inputs.compare_baselines != ''
        run: |
          set -euo pipefail
          BASE="${{ inputs.compare_baselines }}"
          git fetch --no-tags origin "refs/heads/$BASE:refs/remotes/origin/$BASE"
          base=$(git rev-parse "origin/$BASE")
          rm -rf tests/baselines
          if git cat-file -e "$base:tests/baselines" 2>/dev/null; then
            git checkout "$base" -- tests/baselines
          fi
          echo "Comparing screenshots against $BASE ($base)"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build + run tests
        id: build
        run: |
          set -euo pipefail
          # An event without inputs (a push, for example) leaves the task list empty, and an empty
          # Gradle task list is a green build that ran nothing.
          TASKS="${{ inputs.gradle_tasks }}"
          if [ -z "$TASKS" ]; then
            TASKS=test
          fi
          # --continue so one failing lifecycle suite does not stop the others: the screenshot
          # suites write a missing baseline before they fail, and a bootstrapping run has to reach
          # all three of them. The step still fails on the first non-zero task result.
          ./gradlew $TASKS --continue --no-daemon --console=plain \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.worker.jvmargs="-Xmx2g"
        timeout-minutes: 120

      - name: Regenerate the screenshot baselines
        if: failure() && steps.build.outcome == 'failure' && inputs.compare_baselines != ''
        continue-on-error: true
        run: |
          ./gradlew testFabricShots testForgeShots testQuiltShots --no-daemon --console=plain \
            -Pminecheck.screenshots.update=true -Pminecheck.baselines=ci \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.worker.jvmargs="-Xmx2g"
        timeout-minutes: 90

      - name: Collect the changed baselines
        if: always() && inputs.compare_baselines != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/changed-baselines"
          # Relative to HEAD (the PR's own copy), so this is exactly the set of files the post-merge
          # job has to write. Deletions are excluded: only files that will be committed matter.
          git status --porcelain -- tests/baselines \
            | awk '$1 != "D" {print $NF}' \
            | sort -u > "$RUNNER_TEMP/changed-baselines/changed.txt"
          echo "Changed baselines:"
          cat "$RUNNER_TEMP/changed-baselines/changed.txt"

      - name: Upload screenshot captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            src/*/mod/run/client/screenshots/**/*.png
            src/*/mod/run/client/screenshots/profile.json
            tests/baselines/**/*.png
            tests/baselines/**/profile.json
            tests/local-baselines/**/*.png
            tests/local-baselines/**/profile.json
            src/*/mod/run/client/config/minecheck/run-result.json
            src/*/mod/run/client/logs/latest.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the changed baseline list
        if: always() && inputs.compare_baselines != ''
        uses: actions/upload-artifact@v4
        with:
          name: changed-baselines
          path: ${{ runner.temp }}/changed-baselines/changed.txt
          retention-days: 1
          if-no-files-found: ignore
