#
# The per-version test slot's scheduler. The logic lives in kirjorjos/ci; this file only chooses
# when it runs. See the README, "The test slot".
#
# `pull_request_target`, not `pull_request`: writing the `ci-queue/<version>` branch needs
# `contents: write` and the app token, and a fork's pull request must never be checked out here.
name: Test slot
on:
  pull_request_target:
    types: [closed, reopened, ready_for_review, synchronize]
  push:
    branches:
      - "*/development"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Clear a stuck holder on every line before reconciling.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  checks: write
  pull-requests: write

concurrency:
  group: test-slot-scheduler
  cancel-in-progress: false

jobs:
  reconcile:
    name: Test slot
    uses: kirjorjos/ci/.github/workflows/slot.yml@minecraft-mods/v2
    permissions:
      contents: write
      checks: write
      pull-requests: write
    secrets: inherit
    with:
      force: ${{ inputs.force || 'false' }}
