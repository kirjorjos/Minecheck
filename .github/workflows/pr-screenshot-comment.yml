name: PR screenshot baselines

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-22.04
    steps:
      - name: Download the mismatch manifest
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: changed-baselines
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/changed-baselines

      - name: Comment the mismatch table
        id: table
        uses: actions/github-script@v7
        env:
          MANIFEST: ${{ runner.temp }}/changed-baselines/manifest.jsonl
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        with:
          script: |
            const fs = require("node:fs");
            const run = context.payload.workflow_run;
            const baseline = /^tests\/baselines\/(fabric|forge|quilt)\/[^/]+\.png$/;

            // One JSON object per line, written by the screenshot task in report mode:
            // {"path":"tests/baselines/fabric/world-settled.png","class":"change"}
            const entries = [];
            if (fs.existsSync(process.env.MANIFEST)) {
              for (const line of fs.readFileSync(process.env.MANIFEST, "utf8").split("\n")) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                let entry;
                try {
                  entry = JSON.parse(trimmed);
                } catch (error) {
                  core.warning(`Ignoring unparseable manifest line: ${trimmed}`);
                  continue;
                }
                if (!entry || typeof entry.path !== "string" || !baseline.test(entry.path)) {
                  core.warning(`Ignoring unexpected manifest entry: ${trimmed}`);
                  continue;
                }
                entries.push({ path: entry.path, kind: entry.class || "change" });
              }
            }
            core.setOutput("count", String(entries.length));

            if (entries.length === 0) {
              core.info("No screenshot mismatches reported - nothing to comment.");
              return;
            }

            let number = run.pull_requests?.[0]?.number;
            if (!number) {
              const headOwner = (run.head_repository?.full_name ?? "").split("/")[0];
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                head: `${headOwner}:${run.head_branch}`,
              });
              number = pulls[0]?.number;
            }
            if (!number) {
              core.warning(`Could not resolve the pull request for run ${run.id}.`);
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });

            // Group by loader so the table answers "what did each loader do", which is how a
            // mismatch is acted on: it decides which baseline tree the chore rewrites.
            const byLoader = new Map();
            for (const entry of entries) {
              const loader = entry.path.split("/")[2];
              if (!byLoader.has(loader)) byLoader.set(loader, []);
              byLoader.get(loader).push(entry);
            }

            const green = process.env.CONCLUSION === "success";
            const rows = [];
            for (const [loader, list] of [...byLoader].sort((a, b) => a[0].localeCompare(b[0]))) {
              rows.push(`| loader | ${loader} | |`);
              for (const entry of list) {
                rows.push(`| | \`${entry.path.split("/").pop()}\` | ${entry.kind} |`);
              }
            }

            const marker = "<!-- screenshots-baselines:changed -->";
            const body = [
              marker,
              "",
              `Screenshot baselines differ from \`${pull.base.ref}\` at commit \`${run.head_sha.slice(0, 7)}\` (${entries.length} capture${entries.length === 1 ? "" : "s"}):`,
              "",
              "| loader | capture | class |",
              "|---|---|---|",
              ...rows,
              "",
              green
                ? "A second capture of exactly these reproduced them byte for byte, so they are deterministic: this run is green, and the post-merge chore writes these pictures into the branch."
                : "The rerun of these captures did not reproduce them - this run is red for nondeterminism, not for the committed pictures.",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated the mismatch table on PR #${number}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
              console.log(`Commented ${entries.length} mismatch(es) on PR #${number}.`);
            }

      - name: Report the mismatch-table check
        uses: actions/github-script@v7
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          COUNT: ${{ steps.table.outputs.count }}
        with:
          script: |
            // The second required context on <mc>/development: it cannot go green before the
            // table above has been handled, and it mirrors the run's own verdict.
            const run = context.payload.workflow_run;
            const conclusion = process.env.CONCLUSION === "success" ? "success" : "failure";
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "Screenshot mismatch table",
                head_sha: run.head_sha,
                status: "completed",
                conclusion,
                output: {
                  title: `${process.env.COUNT || 0} mismatch(es)`,
                  summary:
                    conclusion === "success"
                      ? "Every reported mismatch reproduced byte for byte, or there was none."
                      : "The run is red: either a capture did not reproduce, or a loader failed.",
                },
              });
            } catch (error) {
              // A fork PR's head commit is not in this repository, so the check cannot be attached
              // to it. The comment above is still what a reviewer reads.
              core.warning(`Could not report the mismatch-table check: ${error.message}`);
            }
