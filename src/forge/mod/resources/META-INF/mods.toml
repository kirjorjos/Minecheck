modLoader = "javafml"
loaderVersion = "[40,)"
license = "${licence}"

[[mods]]
modId = "minecheck"
version = "0.1.0"
displayName = "Minecheck"
description = "Scripted automation of the Minecraft client and server for mod development"

[[dependencies.minecheck]]
modId = "forge"
mandatory = true
versionRange = "[40,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.minecheck]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},${minecraft_next})"
ordering = "NONE"
side = "BOTH"

# Optional in both directions: MineCam is usable standalone, and Minecheck only wants it to own
# the human's camera. Neither mod may require the other, and MineCam is client-only.
[[dependencies.minecheck]]
modId = "freecam"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"
