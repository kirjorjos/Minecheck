# Minecraft version this branch builds against: one branch per MC version. The release workflow
# overrides this with -Pminecraft_version=<mc>.
minecraft_version=1.18.1

org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
org.gradle.worker.jvmargs=-Xmx8g

# The licence identifier every loader's metadata declares, substituted into fabric.mod.json,
# quilt.mod.json and mods.toml at build time. LICENSE.txt holds the text; this holds the
# identifier, and there being one copy of it is the point.
licence=GPL-3.0-only
